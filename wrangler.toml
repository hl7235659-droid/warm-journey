name = "warm-journey"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[[d1_databases]]
binding = "DB"
database_name = "warm-journey-db"
database_id = "87ee3b36-9356-4ff2-9f0b-210178f588df"

# 上报 / 巡检图片存储（桶需先创建：npx wrangler r2 bucket create warm-journey-images）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "warm-journey-images"

# 仓库内禁止存放任何密钥。JWT_SECRET 等一律走：
#   npx wrangler pages secret put JWT_SECRET
# 本地开发密钥放 .dev.vars（已在 .gitignore 中忽略）。
[vars]
NEXT_PUBLIC_APP_URL = "https://warm-journey.pages.dev"
