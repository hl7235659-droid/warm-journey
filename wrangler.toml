name = "warm-journey"
# 账户锁定：OAuth token 关联两个账户时，wrangler 非交互模式无法自选（2026-10-06
# 部署预检因此误报"D1 缺列"）。warm-journey 项目在 Hl7235659@gmail.com 主账户下。
account_id = "8ab156b372aaccebcd4be4267070ecaa"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# 自定义域（Workers Custom Domains：自动建 DNS + 证书，国内可直连）。
# 配 routes 后 wrangler 默认关闭 workers.dev，显式保留作备用入口（代理场景/兜底）。
workers_dev = true
routes = [
  { pattern = "warm-journey.hosha-room.cloud", custom_domain = true }
]

# 台账 GC（uploads 30 天 / ai_rate 7 天 + 过期 visit 兜底），见 src/worker.ts
[triggers]
crons = ["0 3 * * *"]

# 小暖的服务端兜底提供商：AI_BASE_URL / AI_API_KEY / AI_MODEL 三件套缺任何一件，
# /api/ai/chat 就只会走本地降级回答，悬浮窗徽章显示「离线模式」（判据见 resolveServerProvider）。
# 批次 9 从 Pages 迁 Workers 时这三个变量没跟过来，线上静默退化了一次，所以非敏感的两项
# 直接写进配置随部署走，密钥仍走 secret：npx wrangler secret put AI_API_KEY
[vars]
AI_BASE_URL = "https://api.deepseek.com/v1"
AI_MODEL = "deepseek-chat"

# Workers 静态资产（OpenNext 构建产物）
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# OpenNext 自引用（ISR / 重新验证路径走 Worker 自身）
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "warm-journey"

[[d1_databases]]
binding = "DB"
database_name = "warm-journey-db"
database_id = "87ee3b36-9356-4ff2-9f0b-210178f588df"

# 上报 / 巡检图片存储（桶需先创建：npx wrangler r2 bucket create warm-journey-images）
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "warm-journey-images"

# 仓库内禁止存放任何密钥。JWT_SECRET 等一律走：
#   npx wrangler secret put JWT_SECRET
# 本地开发密钥放 .dev.vars（已在 .gitignore 中忽略）。
